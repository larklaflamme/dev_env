# ~/.config/tmux/tmux.conf (dev_env)   prefix = Ctrl-a    reload = prefix r

# ---- terminal: true colour + undercurl for Neovim ----
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB,ghostty:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g default-shell /usr/bin/zsh

# ---- behaviour ----
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on        # images / OSC sequences from nvim, yazi
setw -g mode-keys vi
set -g detach-on-destroy off       # closing a session jumps to another one

# ---- prefix: Ctrl-a ----
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- splits/windows open in the current directory ----
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ---- vim-style pane navigation / resizing ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- copy mode: v select, y yank ----
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---- popups ----
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind f display-popup -E -w 80% -h 60% "tmux list-sessions -F '#S' | fzf --reverse | xargs -r tmux switch-client -t"

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ---- status bar: minimal, top ----
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-left "#[fg=#89b4fa,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=#a6adc8]#{?client_prefix,#[fg=#f38ba8]PREFIX ,}%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
