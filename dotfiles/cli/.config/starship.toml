# ~/.config/starship.toml — dev_env prompt. Needs a Nerd Font.
# Two lines: context on top, a clean input line below.
#   ~/code/app  main ⇡1 !2   v3.12(ml)  1.83  1.25  v22  🐳 ctx      took 4s
#   ❯

"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
command_timeout = 800

format = """
$os$username$hostname$directory$git_branch$git_state$git_status\
$python$conda$rust$golang$nodejs$bun$docker_context$container\
$fill$cmd_duration$jobs$time
$character"""

[fill]
symbol = " "

[os]
disabled = false
style = "bold blue"
[os.symbols]
Ubuntu = " "

[username]
show_always = false            # only over SSH / as root
format = "[$user]($style)@"
[hostname]
ssh_only = true
format = "[$hostname]($style) "

[directory]
style = "bold cyan"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "bold yellow"
format = '([$all_status$ahead_behind]($style) )'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[python]
symbol = " "
format = '[${symbol}${version}(\($virtualenv\))]($style) '
detect_extensions = []          # only show in real python projects
detect_files = ["pyproject.toml", "requirements.txt", "setup.py", "uv.lock", "environment.yml"]

[conda]
symbol = "🅒 "
ignore_base = true
format = "[$symbol$environment]($style) "

[rust]
symbol = " "
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
format = "[$symbol($version)]($style) "

[nodejs]
symbol = " "
format = "[$symbol($version)]($style) "

[bun]
format = "[🥟 ($version)]($style) "

[docker_context]
symbol = " "
only_with_files = true

[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "dimmed yellow"
show_notifications = false

[jobs]
symbol = "✦ "

[time]
disabled = true                 # flip to false for a clock on the right

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
